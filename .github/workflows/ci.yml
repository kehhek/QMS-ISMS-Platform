name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: multi_tenant_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: 'True'
      POSTGRES_DB: multi_tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply shared-schema migrations
        run: python manage.py migrate_schemas --shared

      - name: Apply remaining migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test tests

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Report-only: this currently flags known Django 4.2 CVEs whose fixes
      # are on 5.2.x/6.0.x, outside this project's `Django>=4.2,<5` pin — a
      # deliberate major-version upgrade decision, not something to silently
      # "fix" here. Keep this visible every run rather than blocking on it.
      - name: Python dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # Static analysis for common Python security antipatterns. Blocking at
      # medium+ severity (-ll); low-severity subprocess-usage findings are
      # expected noise for the backup/restore tooling and not gated on.
      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r . -x ./frontend,./.venv -ll

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Report-only: the frontend's dependency tree already carries known
      # vulnerabilities (react-scripts' own transitive deps) that aren't
      # cheap to fix without a bigger CRA/tooling migration.
      - name: Frontend dependency audit (npm audit)
        continue-on-error: true
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level=high
