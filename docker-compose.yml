services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: multi_tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Loopback-only: this used to be 0.0.0.0-bound (Compose's default),
      # meaning Postgres itself — not just the app — was reachable from
      # outside this machine on any interface/router-forwarded port. It
      # never needs to be reached by anything but tools running on this
      # host (psql, a GUI client), which '127.0.0.1:' already covers.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    # No auth at all before this — anyone who could reach the port could
    # read/write the Celery queue outright.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'

  web:
    build: .
    # See the Dockerfile's CMD comment — override worker count via
    # GUNICORN_CMD_ARGS in the environment block below if needed locally.
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: multi_tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A project worker -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: multi_tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - web
      - redis

  celery-beat:
    build: .
    command: celery -A project beat -l info
    volumes:
      - .:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      POSTGRES_DB: multi_tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - web
      - redis

  frontend:
    image: node:18
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - '127.0.0.1:3001:3000'
    command: sh -c "npm install && npm start"
    depends_on:
      - web

volumes:
  pgdata:
